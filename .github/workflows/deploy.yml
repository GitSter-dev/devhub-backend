name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Existing image tag to roll back to: a release (v1.2.0) or a commit SHA. Leave blank to build HEAD."
        required: false

concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  test:
    if: inputs.image_tag == ''
    uses: ./.github/workflows/test.yml

  deploy:
    needs: [test]
    if: always() && (needs.test.result == 'success' || inputs.image_tag != '')
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - uses: actions/checkout@v4

      - id: tag
        run: echo "tag=${{ inputs.image_tag || github.sha }}" >> "$GITHUB_OUTPUT"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - name: Build and push image
        if: inputs.image_tag == ''
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ vars.ECR_REPOSITORY_URL }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # ECR immutable tags reject the extra manifest buildx pushes by default.
          provenance: false

      - name: Roll the instance
        env:
          IMAGE_TAG: ${{ steps.tag.outputs.tag }}
          INSTANCE_ID: ${{ vars.INSTANCE_ID }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: .github/scripts/deploy.sh

      # The real health gate already ran on the instance. This proves TLS
      # terminates and the app, not just Caddy, is answering from the internet.
      - name: Verify the public endpoint
        run: |
          code=$(curl -sS --max-time 10 --retry 6 --retry-delay 5 \
            -o /dev/null -w '%{http_code}' "https://${{ vars.DEVHUB_DOMAIN }}/auth/")
          echo "GET /auth/ -> $code"
          case "$code" in
            000) echo "::error::no response - TLS or the listener is down"; exit 1 ;;
            5*)  echo "::error::origin returned $code"; exit 1 ;;
            *)   echo "endpoint is serving" ;;
          esac
